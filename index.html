<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="style.css">
    <script src="pro1.js"></script>
</head>
<body>
<div class="container">
    <div class="image-side">
        <img src="images/pro1.jpg">
    </div>

    <div class="form-side">
        <h1><b>Plant a Tree, Grow Our Future</b></h1>
        <p1>Join Our Community Tree-Planting Day!</p1>

        <h2>Let's save the world!</h2>

        <label for="first-name">*First Name:
        <input type="text" id="first-name" name="first-name" required>
        </label>

        <label for="last-name">*Last Name:
        <input type="text" id="last-name" name="last-name" required>
        </label>

        <label for="email-address">*Email-Address:
        <input type="email" id="email-address" name="email-address" placeholder="joe@gmail.com" required>
        </label>

        <label for="phone-number">*Phone Number:
        <input type="tel" id="phone-number" name="phone-number" required>
        </label>

        <div class="btn">
            <button><b>Register</b></button>
        </div>
    </div>
</div>
</body>
</html>
